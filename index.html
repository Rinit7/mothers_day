<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happy Mother's Day</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #c97b84;
    --rose-light: #f2d5d8;
    --rose-pale: #fdf0f1;
    --rose-deep: #9a5a63;
    --cream: #faf6f0;
    --gold: #c8a97e;
    --text-dark: #3a2a2c;
    --text-mid: #7a5a5e;
    --text-light: #b89aa0;
  }

  html, body { height: 100%; overflow: hidden; background: var(--cream); font-family: 'Jost', sans-serif; }

  .page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1), transform 0.9s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
  }
  .page.hidden { opacity: 0; pointer-events: none; transform: scale(1.04); }

  .petals-bg { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
  .petal { position: absolute; border-radius: 60% 40% 60% 40%; opacity: 0; animation: fall linear infinite; }
  @keyframes fall {
    0%   { transform: translateY(-60px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.35; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .ring { position: absolute; border-radius: 50%; border: 1px solid var(--rose-light); opacity: 0.5; pointer-events: none; }

  /* ══ PAGE 1 ══ */
  #page1 { background: linear-gradient(160deg, #fdf0f1 0%, #faf6f0 55%, #f7ede8 100%); }

  .content1 { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 2rem 2.5rem; text-align: center; }

  .eyebrow { font-weight: 200; font-size: 0.72rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--rose); margin-bottom: 2rem; opacity: 0; animation: fadeUp 1s ease 0.3s forwards; }

  .main-title { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic; font-size: clamp(3.2rem, 13vw, 5rem); line-height: 1.05; color: var(--text-dark); letter-spacing: -0.01em; margin-bottom: 0.4rem; opacity: 0; animation: fadeUp 1s ease 0.55s forwards; }
  .main-title span { color: var(--rose-deep); display: block; }

  .divider-line { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 1.6rem auto; opacity: 0; animation: fadeUp 1s ease 0.8s forwards; }

  .subtitle { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 300; color: var(--text-mid); line-height: 1.75; max-width: 260px; opacity: 0; animation: fadeUp 1s ease 1s forwards; margin-bottom: 3rem; }

  .cta-btn {
    position: relative; display: inline-flex; align-items: center; gap: 0.65rem;
    padding: 0.85rem 2.2rem; border: 1px solid var(--rose); border-radius: 100px;
    background: transparent; color: var(--rose-deep); font-family: 'Jost', sans-serif;
    font-weight: 300; font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer; transition: all 0.4s ease; opacity: 0; animation: fadeUp 1s ease 1.25s forwards; overflow: hidden;
  }
  .cta-btn::before { content: ''; position: absolute; inset: 0; background: var(--rose); transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease; border-radius: 100px; }
  .cta-btn:hover::before { transform: scaleX(1); }
  .cta-btn:hover { color: white; }
  .cta-btn span { position: relative; z-index: 1; }
  .cta-arrow { position: relative; z-index: 1; width: 14px; height: 14px; transition: transform 0.3s ease; }
  .cta-btn:hover .cta-arrow { transform: translateX(3px); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

  /* ══ PAGE 2 ══ */
  #page2 { background: linear-gradient(175deg, #1a0f12 0%, #2c1519 40%, #1e0e10 100%); justify-content: flex-start; }

  .header2 { position: relative; z-index: 2; width: 100%; padding: 4.5rem 2rem 1.8rem; text-align: center; flex-shrink: 0; }

  .header2-eyebrow { font-weight: 200; font-size: 0.65rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; opacity: 0; transition: opacity 0.8s 0.3s, transform 0.8s 0.3s; transform: translateY(12px); }
  .header2-title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: clamp(2.8rem, 11vw, 4.2rem); line-height: 1.05; color: white; opacity: 0; transition: opacity 0.9s 0.5s, transform 0.9s 0.5s; transform: translateY(14px); margin-bottom: 0.3rem; }
  .header2-title em { color: var(--rose-light); display: block; font-size: 0.85em; }
  .gold-line { width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 1.2rem auto 0; opacity: 0; transition: opacity 0.8s 0.65s; }

  #page2.active .header2-eyebrow { opacity: 1; transform: translateY(0); }
  #page2.active .header2-title   { opacity: 1; transform: translateY(0); }
  #page2.active .gold-line        { opacity: 1; }

  /* ══ PEEK CAROUSEL ══ */
  .slideshow-wrap {
    position: relative; z-index: 2;
    width: 100%; flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 0 0 1.5rem;
    min-height: 0;
    overflow: hidden; /* clips peeking cards at screen edge */
  }

  /*
    The track slides left/right as a whole unit.
    Each card is a fixed-width item sitting inline.
    The track is centred on the active card via JS transform.
  */
  .carousel-track {
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.52s cubic-bezier(0.77, 0, 0.175, 1);
    will-change: transform;
    padding: 12px 0;  /* room for scale + shadow */
  }

  /* Each card — fixed aspect ratio 4:3, width = 72vw so ~14vw peeks each side */
  .slide {
    flex: 0 0 72vw;
    width: 72vw;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    transition: transform 0.52s cubic-bezier(0.77,0,0.175,1),
                box-shadow 0.52s ease,
                opacity 0.52s ease;
    opacity: 0.45;
    transform: scale(0.88);
    cursor: pointer;
    flex-shrink: 0;
  }

  /* active card is full size, fully opaque */
  .slide.active {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(200,169,126,0.25);
  }

  .slide-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  /* caption below the active card */
  .caption-area {
    text-align: center;
    padding: 1rem 2rem 0;
    min-height: 2.6rem;
  }

  .caption-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.55;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .caption-text.visible { opacity: 1; transform: translateY(0); }

  /* dots */
  .dots {
    display: flex; gap: 6px; justify-content: center;
    padding: 0.9rem 0 0;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(200,169,126,0.3);
    transition: all 0.4s ease; cursor: pointer;
  }
  .dot.active { background: var(--gold); width: 20px; border-radius: 3px; }

  /* back btn */
  .back-btn {
    position: absolute; top: 1.2rem; left: 1.2rem; z-index: 10;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7); border-radius: 50%;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.3s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.13); color: white; }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- PAGE 1 -->
<div class="page" id="page1">
  <div class="petals-bg" id="petals1"></div>
  <div class="ring" style="width:340px;height:340px;top:-90px;right:-100px;"></div>
  <div class="ring" style="width:200px;height:200px;bottom:60px;left:-70px;opacity:0.3;"></div>

  <div class="content1">
    <p class="eyebrow">A gift with love</p>
    <h1 class="main-title">
      For the
      <span>one who</span>
      made me
    </h1>
    <div class="divider-line"></div>
    <p class="subtitle">There are no words grand enough — but here are a few, just for you.</p>
    <button class="cta-btn" onclick="goToPage2()">
      <span>Open your gift</span>
      <svg class="cta-arrow" viewBox="0 0 14 14" fill="none">
        <path d="M1 7h12M7 1l6 6-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page hidden" id="page2">
  <div class="petals-bg" id="petals2"></div>

  <button class="back-btn" onclick="goToPage1()" aria-label="Back">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="header2">
    <p class="header2-eyebrow">with all my heart</p>
    <h2 class="header2-title">
      Happy<br>
      <em>Mother's Day</em>
    </h2>
    <div class="gold-line"></div>
  </div>

  <div class="slideshow-wrap">
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="caption-area"><p class="caption-text" id="captionText"></p></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
const slides = [
  { img: 'IMG_20241216_222153.jpg',  caption: 'Every moment with you is a treasure' },
  { img: 'IMG_20250407_204358.jpg',  caption: 'Your smile lights up every room' },
  { img: 'IMG_20250407_204511.jpg',  caption: 'Side by side or miles apart, always in my heart' },
  { img: 'IMG_20250421_141036.jpg',  caption: 'The best adventures are the ones with you' },
  { img: 'IMG_20250426_235329.jpg',  caption: 'Thank you for always being there' },
  { img: 'IMG_20250426_235341.jpg',  caption: 'Every flower blooms because of you' },
  { img: 'IMG_20250501_111541.jpg',  caption: 'Your warmth is the light I always come home to' },
  { img: 'IMG_20250501_142321.jpg',  caption: 'A thousand memories, each one perfect' },
  { img: 'IMG_20250513_122030.jpg',  caption: 'You make ordinary days feel magical' },
  { img: 'IMG_20250602_094444.jpg',  caption: 'Thank you for everything, Mum' },
  { img: 'IMG_20250608_135615.jpg',  caption: 'Love that grows stronger with every season' },
  { img: 'IMG_20250829_212809.jpg',  caption: 'You are my forever sunshine' },
  { img: 'IMG_20250830_153119.jpg',  caption: 'No words are grand enough — but I love you' },
  { img: 'IMG_20250927_134102.jpg',  caption: "Happy Mother's Day, with all my heart" }
];

const track      = document.getElementById('carouselTrack');
const dotsEl     = document.getElementById('dots');
const captionEl  = document.getElementById('captionText');
let current  = 0;
let autoTimer = null;
const DURATION = 4000;

/* card width + gap — must match CSS */
const CARD_VW  = 72;   /* vw */
const GAP_PX   = 14;   /* px */

function cardW() { return window.innerWidth * CARD_VW / 100; }

/* build cards */
slides.forEach((s, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide' + (i === 0 ? ' active' : '');

  const img = document.createElement('img');
  img.className = 'slide-img';
  img.src = s.img;
  img.alt = 'Memory ' + (i + 1);
  img.draggable = false;

  slide.appendChild(img);
  slide.addEventListener('click', () => { if (i !== current) { stopAuto(); goToSlide(i); startAuto(); } });
  track.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => { stopAuto(); goToSlide(i); startAuto(); });
  dotsEl.appendChild(dot);
});

/* position track so active card is centred */
function positionTrack(idx, animated) {
  const cw   = cardW();
  const vw   = window.innerWidth;
  /* offset = how much to shift left so card[idx] is centred */
  const offset = idx * (cw + GAP_PX) - (vw - cw) / 2;
  track.style.transition = animated
    ? 'transform 0.52s cubic-bezier(0.77,0,0.175,1)'
    : 'none';
  track.style.transform = `translateX(${-offset}px)`;
}

function updateCaption(idx) {
  captionEl.classList.remove('visible');
  setTimeout(() => {
    captionEl.textContent = slides[idx].caption;
    captionEl.classList.add('visible');
  }, 160);
}

function goToSlide(next) {
  const sl = track.querySelectorAll('.slide');
  const dt = dotsEl.querySelectorAll('.dot');
  sl[current].classList.remove('active');
  dt[current].classList.remove('active');
  current = (next + slides.length) % slides.length;
  sl[current].classList.add('active');
  dt[current].classList.add('active');
  positionTrack(current, true);
  updateCaption(current);
}

function nextSlide() { goToSlide(current + 1); }
function prevSlide()  { goToSlide(current - 1); }
function startAuto()  { clearInterval(autoTimer); autoTimer = setInterval(nextSlide, DURATION); }
function stopAuto()   { clearInterval(autoTimer); }

/* initial position (no animation) */
positionTrack(0, false);
updateCaption(0);

/* reposition on resize */
window.addEventListener('resize', () => positionTrack(current, false));

/* touch swipe on track */
let tx = 0, dragging = false;
track.addEventListener('touchstart', e => { tx = e.touches[0].clientX; dragging = false; }, { passive: true });
track.addEventListener('touchmove',  e => { if (Math.abs(e.touches[0].clientX - tx) > 8) dragging = true; }, { passive: true });
track.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (dragging && Math.abs(dx) > 40) { stopAuto(); dx < 0 ? nextSlide() : prevSlide(); startAuto(); }
});

/* mouse drag */
let mx = 0, mdown = false;
track.addEventListener('mousedown', e => { mx = e.clientX; mdown = true; });
track.addEventListener('mouseup',   e => {
  if (!mdown) return; mdown = false;
  const dx = e.clientX - mx;
  if (Math.abs(dx) > 40) { stopAuto(); dx < 0 ? nextSlide() : prevSlide(); startAuto(); }
});
track.addEventListener('mouseleave', () => { mdown = false; });

/* page nav */
function goToPage2() {
  document.getElementById('page1').classList.add('hidden');
  const p2 = document.getElementById('page2');
  p2.classList.remove('hidden');
  setTimeout(() => { p2.classList.add('active'); positionTrack(current, false); }, 30);
  startAuto();
  launchConfetti();
  generatePetals('petals2', true);
}

function goToPage1() {
  const p2 = document.getElementById('page2');
  p2.classList.remove('active');
  setTimeout(() => {
    p2.classList.add('hidden');
    document.getElementById('page1').classList.remove('hidden');
    stopAuto();
  }, 900);
}

/* petals */
function generatePetals(id, dark) {
  const el = document.getElementById(id);
  if (!el || el.childElementCount > 0) return;
  const c = dark
    ? ['rgba(201,123,132,0.35)','rgba(200,169,126,0.25)','rgba(255,255,255,0.1)']
    : ['rgba(201,123,132,0.45)','rgba(242,213,216,0.65)','rgba(200,169,126,0.3)'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const sz = 6 + Math.random() * 12;
    p.style.cssText = `width:${sz}px;height:${sz*.6}px;left:${Math.random()*100}%;background:${c[~~(Math.random()*c.length)]};animation-duration:${6+Math.random()*8}s;animation-delay:${Math.random()*8}s;border-radius:${40+Math.random()*30}% ${60-Math.random()*20}% ${40+Math.random()*30}% ${60-Math.random()*20}%;`;
    el.appendChild(p);
  }
}
generatePetals('petals1', false);

/* confetti */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const cols = ['#c97b84','#c8a97e','#f2d5d8','#ffffff','#e8d5b7','#9a5a63'];
  const pts = Array.from({length: 90}, () => ({
    x: Math.random()*canvas.width, y: -10-Math.random()*60,
    w: 5+Math.random()*7, h: 3+Math.random()*4,
    color: cols[~~(Math.random()*cols.length)],
    speed: 2.5+Math.random()*3, angle: Math.random()*Math.PI*2,
    spin: (Math.random()-.5)*.15, drift: (Math.random()-.5)*1.5
  }));
  let f = 0;
  (function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p => {
      p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
      ctx.save(); ctx.globalAlpha=Math.max(0,.9-f/120);
      ctx.translate(p.x+p.w/2,p.y+p.h/2); ctx.rotate(p.angle);
      ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(++f<140) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  })();
}
</script>
</body>
</html>
